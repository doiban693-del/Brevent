name: Bug Report
description: Report a bug with Brevent. Please fill in all required fields, incomplete issues may be closed without response.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill in the details below carefully to help us investigate the issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have updated Brevent to the latest version and the issue still exists.
          required: true
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: This is a bug report, not a usage question. I understand that general questions should be asked in [Discussions](https://github.com/brevent/Brevent/discussions).
          required: true

  - type: input
    id: brevent-version
    attributes:
      label: Brevent version
      placeholder: "e.g. 4.2.29.1"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
    validations:
      required: true

  - type: dropdown
    id: bug-category
    attributes:
      label: Bug category
      description: Select the category that best describes your issue.
      options:
        - Activation / startup failure
        - App not being prevented (still running in background)
        - App incorrectly killed (stopped when it shouldn't be)
        - Notifications not received / sync issues
        - Stops working after reboot
        - UI / interaction issues
        - Abnormal battery drain / overheating
        - Crash / force close
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe what happened and what you expected to happen.
      placeholder: |
        Actual behavior: ...
        Expected behavior: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps to reproduce the issue.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: logcat
    attributes:
      label: Logs
      description: |
        Please provide relevant logcat output. You can capture it with `adb logcat -s BreventServer`.
        Screenshots can also be pasted here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other info that might help (e.g. Xposed modules, special settings, etc.)
    validations:
      required: false
